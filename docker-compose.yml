services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # TLS termination. The command renders the configs with sed (no envsubst
  # dependency) and self-bootstraps: until the certificate exists only the
  # ACME/redirect vhost is enabled; the TLS vhost turns on automatically
  # within ~30s after certbot succeeds.
  nginx:
    image: nginx:1.29-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "443:443"
      - "8081:80"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - backend
    restart: unless-stopped
    command: >
      /bin/sh -c
      'render() {
      sed "s/\$${DOMAIN}/$$DOMAIN/g" /etc/nginx/templates/http.conf.template > /etc/nginx/conf.d/http.conf;
      if [ -e /etc/letsencrypt/live/$$DOMAIN/fullchain.pem ];
      then sed "s/\$${DOMAIN}/$$DOMAIN/g" /etc/nginx/templates/ssl.conf.template > /etc/nginx/conf.d/ssl.conf;
      else : > /etc/nginx/conf.d/ssl.conf;
      fi;
      };
      render;
      nginx -g "daemon off;" &
      while :; do sleep 30; render; nginx -s reload; done'

  certbot:
    image: certbot/certbot
    environment:
      DOMAIN: ${DOMAIN}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    restart: unless-stopped
    # Retry every 2 minutes until the first certificate lands (nginx needs a
    # moment to start serving the ACME path), then renew on the usual 12h cycle.
    entrypoint: >
      /bin/sh -c
      'trap exit TERM;
      sleep 30;
      while :; do
      if certbot certonly --webroot -w /var/www/certbot
      -d $$DOMAIN --email $$CERTBOT_EMAIL
      --agree-tos --non-interactive --keep-until-expiring;
      then sleep 12h; else echo "certbot failed, retrying in 2m"; sleep 2m; fi;
      done'

volumes:
  pgdata:
  certbot_www:
  certbot_certs:
